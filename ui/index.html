<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailscale</title>
<style>
	:root {
		--bg: #fff; --bg2: #f6f8fa; --text: #1f2328; --muted: #656d76; --border: #dde1e6; --accent: #1f6feb;
		--ok: #1a7f37; --warn: #9a6700; --danger: #cf222e; --radius: 6px;
		color-scheme: light dark;
	}
	@media (prefers-color-scheme: dark) {
		:root { --bg: #171b21; --bg2: #1d232b; --text: #e3e7ec; --muted: #97a1ad; --border: #2c333c; --accent: #4c8dff;
			--ok: #3fb950; --warn: #d29922; --danger: #f85149; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
	main { padding: 16px; max-width: 1100px; }
	header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
	h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
	h2 { font-size: 16px; margin: 20px 0 8px; }
	h2:first-child { margin-top: 0; }
	a { color: var(--accent); }
	.muted { color: var(--muted); }
	.small { font-size: 13px; }
	button, input, select { font: inherit; color: inherit; }
	button { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
	button:disabled { opacity: .55; cursor: default; }
	button.link { border: 0; background: none; padding: 0; color: var(--accent); }
	input, select { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 8px; width: 100%; min-width: 0; }
	input[type=checkbox] { width: auto; }
	input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
	.wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
	table { border-collapse: collapse; width: 100%; }
	th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
	th { font-weight: 600; font-size: 13px; color: var(--muted); background: var(--bg2); white-space: nowrap; }
	tr:last-child td { border-bottom: 0; }
	td.num, th.num { text-align: right; white-space: nowrap; }
	.badge { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; margin: 1px 2px 1px 0; }
	.ok { color: var(--ok); } .warn { color: var(--warn); } .danger { color: var(--danger); }
	.msg { padding: 8px 12px; border-radius: var(--radius); border: 1px solid currentColor; margin-bottom: 12px; }
	.msg > span { color: var(--text); }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 14px; }
	label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
	label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 15px; }
	.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	pre { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
	.big { font-size: 17px; word-break: break-all; }
	.steps { padding-left: 20px; } .steps li { margin: 4px 0; }
	details { margin-top: 18px; }
	@media (max-width: 560px) { .opt { display: none; } main { padding: 12px; } }
</style>
</head>
<body>
<main>
	<header><h1>Tailscale</h1></header>
	<div id="msg" hidden></div>
	<section id="view"></section>
</main>
<script>
"use strict";
const api = (path, opts = {}) =>
	fetch(`/api/v1/m/tailscale${path}`, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } })
		.then(async (r) => {
			if (!r.ok) {
				const e = (await r.json().catch(() => ({}))).error;
				throw new Error([e?.message || r.statusText, ...(e?.details || []).map((d) => d.message)].join(": "));
			}
			return r.status === 204 ? null : r.json();
		});

// h("p", { class: "muted", onclick: fn }, "text", child, [more]) — all text goes in as text nodes.
function h(tag, props, ...children) {
	const el = document.createElement(tag);
	for (const [k, v] of Object.entries(props || {})) {
		if (v === null || v === undefined || v === false) continue;
		if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
		else if (k === "class") el.className = v;
		else if (k in el && k !== "list") el[k] = v;
		else el.setAttribute(k, v === true ? "" : String(v));
	}
	for (const c of children.flat(Infinity)) {
		if (c === null || c === undefined || c === false) continue;
		el.append(c instanceof Node ? c : document.createTextNode(String(c)));
	}
	return el;
}
const $ = (s) => document.querySelector(s);
const replace = (el, ...children) => { el.replaceChildren(); for (const c of children.flat(Infinity)) if (c) el.append(c instanceof Node ? c : String(c)); };
const ext = (href, text, cls) => h("a", { href, target: "_blank", rel: "noopener", class: cls }, text);
// Ledger's own pages open in the top window, not in this iframe.
const ledgerLink = (href, text) => h("a", { href, target: "_top" }, text);
const msg = (kind, ...children) => h("div", { class: `msg ${kind}` }, h("span", null, ...children));
const cmd = (text) => h("pre", null, text);
const badge = (text, cls = "") => h("span", { class: `badge ${cls}` }, text);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;


function flash(text, kind = "danger") {
	const m = $("#msg");
	if (!text) { m.hidden = true; return; }
	m.className = `msg ${kind}`;
	replace(m, h("span", null, text));
	m.hidden = false;
}

async function render(el) {
	const n = await api("/node");
	// Sharing is for the whole server: only admins of the main books manage it.
	const admin = n.can_manage;
	const out = [h("h2", null, "Ledger on your tailnet"),
		!admin && n.role === "admin" && h("p", { class: "muted small" }, "Sharing Ledger on the tailnet affects the whole server, so it's managed from the main books by their admins.")];
	const act = (label, cls, fn, okMsg) => h("button", { class: cls, async onclick(e) {
		e.target.disabled = true;
		try { const r = await fn(); if (r === undefined) return show(); if (okMsg) flash(okMsg(r), "ok"); await show(); }
		catch (err) { flash(err.message); e.target.disabled = false; }
	} }, label);
	const recheck = act("Check again", "", async () => flash(""));

	if (!n.reachable && n.not_ready) {
		out.push(msg("warn", "Tailscale is installed and running on the Ledger server, but its service hasn't started properly."),
			h("ol", { class: "steps" },
				h("li", null, "If it was just installed or restarted, wait a few seconds and check again."),
				h("li", null, "Look at its log for the cause: ", cmd("sudo journalctl -u tailscaled -n 50 --no-pager")),
				h("li", null, "If the log mentions /dev/net/tun (common in LXC containers), run it in userspace mode, which Tailscale Serve supports:",
					cmd(`echo 'FLAGS="--tun=userspace-networking"' | sudo tee -a /etc/default/tailscaled\nsudo systemctl restart tailscaled\nsudo tailscale up`))),
			h("p", { class: "muted small" }, n.error), recheck);
	} else if (!n.reachable) {
		out.push(msg("warn", n.error),
			h("p", null, "To reach Ledger over Tailscale, this server must be on your tailnet. On the Ledger server:"),
			h("ol", { class: "steps" },
				h("li", null, "Install Tailscale: ", cmd("curl -fsSL https://tailscale.com/install.sh | sh")),
				h("li", null, "Join your tailnet: ", cmd("sudo tailscale up")),
				h("li", null, "Let Ledger manage Tailscale Serve: ", cmd(`sudo tailscale set --operator=${n.process_user}`))),
			recheck);
	} else if (n.backend_state !== "Running") {
		out.push(h("p", null, "Tailscale is installed on the Ledger server but not connected (", h("b", null, n.backend_state), ")."),
			n.auth_url && h("p", null, ext(n.auth_url, "Approve this server in Tailscale ↗", "big")),
			h("div", { class: "row" },
				admin && act("Log this server in", "primary", async () => {
					const r = await api("/node/login", { method: "POST", body: "{}" });
					if (r.auth_url) window.open(r.auth_url, "_blank", "noopener");
				}),
				recheck),
			h("p", { class: "muted small" }, "Or on the server: sudo tailscale up"));
	} else {
		const self = n.self || {};
		out.push(h("p", null, "This server is ", h("b", null, self.host_name), " on tailnet ", h("b", null, n.tailnet), " ",
			h("span", { class: "muted" }, `(${(self.ips || []).join(", ")})`), "."));
		const shownTarget = n.target.replace("https+insecure", "https");
		if (n.serving) {
			const tc = n.target_check;
			out.push(msg("ok", "Ledger is shared with your tailnet at", h("br"), ext(n.url, n.url, "big"),
				n.http_url && [h("br"), h("span", { class: "small" }, "and ", ext(n.http_url, n.http_url),
					n.http_mode === "redirect" ? " (redirects to https)" : "")]));
			if (n.http_wanted && !n.http_url) {
				out.push(msg("warn", `Plain http:// isn't set up${n.http_conflict ? `: ${n.http_conflict}` : ""}. `,
					admin && act("Set it up", "link", () => api("/node/serve", { method: "POST", body: "{}" }),
						(r) => (r.http_url ? `Ledger also answers at ${r.http_url}` : "Updated."))));
			}
			if (n.http_mode === "proxy") {
				out.push(h("p", { class: "muted small" }, `Your Tailscale (${(n.version || "").split("-")[0]}) can't redirect, so http:// serves Ledger directly. Update Tailscale to 1.92 or later to redirect to https instead.`));
			}
			if (n.funnel) out.push(msg("danger", "Tailscale Funnel is on for this address: Ledger is reachable from the public internet. Turn it off with  tailscale funnel reset  unless that's intended."));
			if (tc && !tc.ok) out.push(msg("danger", `Tailscale forwards to ${shownTarget}, but Ledger isn't reachable there: ${tc.reason}. Visitors get “502”. Fix the address under Advanced (stop sharing first).`));
			if (tc && tc.ok && !tc.ledger) out.push(msg("danger", `${shownTarget} answers (HTTP ${tc.status}) but it isn't Ledger. Fix the address under Advanced (stop sharing first).`));
			out.push(h("p", { class: "muted small" }, "Only devices on your tailnet (subject to your ACLs) can open it; everyone still signs in to Ledger as usual."),
				admin && act("Stop sharing", "", async () => {
					if (!confirm("Stop sharing Ledger on the tailnet? Anyone using the tailnet address loses access.")) return;
					return api("/node/serve", { method: "DELETE" });
				}, () => "Ledger is no longer shared on the tailnet."));
		} else {
			const problems = [
				n.magic_dns === false && "Turn on MagicDNS in the Tailscale admin console (DNS page).",
				!n.https_enabled && "Turn on HTTPS Certificates in the Tailscale admin console (DNS page).",
				n.conflict && `${n.conflict}. Choose another HTTPS port under Advanced.`,
				n.serve_error,
			].filter(Boolean);
			const https = `https://${self.dns_name}${n.port === 443 ? "" : ":" + n.port}/`;
			out.push(n.wanted && msg("warn", "Ledger was shared on the tailnet but isn't any more."),
				problems.map((p) => msg("warn", p)),
				h("p", null, "Share Ledger with your tailnet over HTTPS at ", h("b", null, https),
					n.http_wanted ? [" (and ", h("b", null, `http://${self.dns_name}/`), n.http_redirect_supported ? ", which redirects there" : "", ")"] : "",
					" using Tailscale Serve. It is not exposed to the internet."),
				admin ? act("Share Ledger on the tailnet", "primary", () => api("/node/serve", { method: "POST", body: "{}" }), (r) => `Ledger is now at ${r.url}`)
					: h("p", { class: "muted" }, "An admin of the main books can share it from here."));
		}
	}

	if (admin) {
		const f = h("form", { class: "grid", async onsubmit(e) {
			e.preventDefault();
			try {
				await api("/node/settings", { method: "PUT", body: JSON.stringify({
					serve_target: f.serve_target.value.trim() || null, serve_port: Number(f.serve_port.value),
					socket_path: f.socket_path.value.trim(), serve_http: f.serve_http.checked }) });
				flash("Saved.", "ok"); await show();
			} catch (err) { flash(err.message); }
		} },
			h("label", null, "Ledger address on this server",
				h("input", { name: "serve_target", value: n.target_is_default ? "" : n.target.replace("https+insecure", "https"), placeholder: n.target }),
				h("span", { class: "muted small" }, n.detected_targets?.length
					? `Detected: ${n.detected_targets.join(", ")}. Leave blank to use it.` : "A port (3000) or address (127.0.0.1:3000).")),
			h("label", null, "HTTPS port", h("select", { name: "serve_port" },
				[443, 8443, 10000].map((p) => h("option", { value: p, selected: p === n.port }, p)))),
			h("label", null, "tailscaled socket", h("input", { name: "socket_path", value: n.socket_path })),
			h("label", { class: "check" }, h("input", { type: "checkbox", name: "serve_http", checked: n.http_wanted }), "Also answer plain http://"),
			h("div", null, h("button", null, "Save")));
		out.push(h("details", null, h("summary", { class: "muted" }, "Advanced"), h("div", { style: "margin-top:10px" }, f),
			h("p", { class: "muted small" }, `Ledger runs as ${n.process_user}`, n.version ? ` · Tailscale ${n.version.split("-")[0]}` : "", ".")));
	}
	replace(el, out);
}

async function show() {
	const el = $("#view");
	try { await render(el); }
	catch (err) { el.replaceChildren(); flash(err.message); }
}
show();
</script>
</body>
</html>
