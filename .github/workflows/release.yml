# Releases the module whenever main has a ledger-module.json version that has
# no GitHub Release yet: creates the tag v<version> on that commit and a
# Release with notes from the commits since the last one. Ledger installs the
# latest Release. To release: bump "version", commit, push to main.
#
# Uses only GitHub's built-in token. If it fails with "Resource not
# accessible by integration", allow it under the repository's Settings →
# Actions → General → Workflow permissions ("Read and write permissions").
name: Release

on:
  push:
    branches: [main]
    paths: [ledger-module.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release the manifest's version if it isn't released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(jq -er .version ledger-module.json)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=ledger-module.json::version \"$version\" is not x.y.z"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            # The tag exists (pushed by hand) without a Release: release that tag as it is.
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes --latest
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
          fi
          echo "Released $tag: $(gh release view "$tag" --json url --jq .url)"
